name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    strategy:
      fail-fast: false # a Windows failure must not cancel the Linux run (and the reverse)
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # keep LF line endings on Windows so tests that read source files see the same bytes as on Linux
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # generates .next/types (LayoutProps, PageProps) that tsc needs on a clean checkout
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
